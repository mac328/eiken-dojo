ion.","The festival was really fun last year."],a:0,jp:"\u300C\u4ED6\u306E\u30E1\u30F3\u30D0\u30FC\u306B\u3082\u660E\u65E5\u6765\u3066\u3082\u3089\u304A\u3046\u300D\u3068\u7D9A\u304F\u306E\u3067\u3001\u307E\u3060\u4F5C\u696D\u304C\u6B8B\u3063\u3066\u3044\u308B\u3068\u3044\u3046\u5185\u5BB9\u3002\u300C\u6E96\u5099\u306F\u4E07\u7AEF\u300D\u3067\u306F\u4EBA\u3092\u547C\u3076\u5FC5\u8981\u304C\u306A\u3044\u3002"},{q:"A: Excuse me. (\u3000)\nB: Oh, thank you very much. My leg hurts a little.\nA: Please take your time.",c:["Would you like to sit down?","Is this bag yours?","Could you move over a little?","Do you know the next station?"],a:0,jp:"\u300C\u3042\u308A\u304C\u3068\u3046\u3001\u8DB3\u304C\u5C11\u3057\u75DB\u304F\u3066\u300D\u3068\u7D9A\u304F\u306E\u3067\u3001\u5E2D\u3092\u52E7\u3081\u308B\u8868\u73FE\u3002\u8A70\u3081\u3066\u3082\u3089\u3046\u4F9D\u983C\u3067\u306F\u300C\u3042\u308A\u304C\u3068\u3046\u300D\u3068\u8DB3\u306E\u8A71\u306B\u3064\u306A\u304C\u3089\u306A\u3044\u3002"},{q:"A: I'm sorry, Mr. Sato is out of the office right now.\nB: (\u3000)\nA: Of course. May I have your phone number?",c:["Could you ask him to call me back?","May I speak to him now, please?","Are you Mr. Sato himself?","Sorry, I think I have the wrong number."],a:0,jp:"\u96FB\u8A71\u756A\u53F7\u3092\u805E\u304B\u308C\u3066\u3044\u308B\u306E\u3067\u3001\u6298\u308A\u8FD4\u3057\u306E\u96FB\u8A71\u3092\u983C\u3080\u8868\u73FE\u3002\u5916\u51FA\u4E2D\u3068\u8A00\u308F\u308C\u305F\u76F4\u5F8C\u306B\u300C\u4ECA\u8A71\u3057\u305F\u3044\u300D\u3068\u983C\u3080\u306E\u306F\u4E0D\u81EA\u7136\u3002"},{q:"A: Mom, do I need a jacket today?\nB: (\u3000) It'll get cold in the evening.\nA: OK, I'll take one, then.",c:["Yes, you'd better take one.","No, it'll be warm all day.","I'll buy you a new one this weekend.","You left it at school yesterday."],a:0,jp:"\u300C\u5915\u65B9\u306F\u51B7\u3048\u308B\u300D\u3068\u3044\u3046\u7406\u7531\u3068\u300C\u3058\u3083\u3042\u6301\u3063\u3066\u3044\u304F\u300D\u3 rt?","How was your lesson last week?","Where did you buy that swimsuit?","Who teaches your class?"],a:0,jp:"\u300C4\u6642\u3060\u3051\u3069\u3001\u5C11\u3057\u65E9\u304F\u7740\u304D\u305F\u3044\u300D\u3068\u6642\u523B\u3067\u7B54\u3048\u3066\u3044\u308B\u306E\u3067\u3001\u958B\u59CB\u6642\u523B\u3092\u5C0B\u306D\u308B\u8CEA\u554F\u3002"},{q:"A: I've gained some weight recently.\nB: (\u3000)\nA: That's a good idea. I'll get off the bus one stop early.",c:["Why don't you try walking more?","You should eat more cake, then.","I bought new running shoes yesterday.","You look much thinner than before."],a:0,jp:"weight(\u4F53\u91CD)\u3002\u300C\u4E00\u3064\u624B\u524D\u306E\u30D0\u30B9\u505C\u3067\u964D\u308A\u308B\u300D\u3068\u7D9A\u304F\u306E\u3067\u3001\u3082\u3063\u3068\u6B69\u304F\u3088\u3046\u52E7\u3081\u308B\u63D0\u6848\u3002"},{q:"A: I'm having a barbecue on Saturday. Could you bring something?\nB: Sure. (\u3000)\nA: Great. I'll take care of the meat and drinks.",c:["How about a salad and some fruit?","I'll be there at six in the evening.","Sorry, I don't like barbecues at all.","Where are we going to have it?"],a:0,jp:"take care of \u301C(\u5F15\u304D\u53D7\u3051\u308B)\u3002\u300C\u8089\u3068\u98F2\u307F\u7269\u306F\u3053\u3063\u3061\u3067\u7528\u610F\u3059\u308B\u300D\u3068\u7D9A\u304F\u306E\u3067\u3001\u4F55\u3092\u6301\u3063\u3066\u884C\u304F\u304B\u306E\u63D0\u6848\u304C\u5165\u308B\u3002"},{q:"A: Excuse me. Where is the gift shop in this museum?\nB: (\u3000)\nA: Thank you. Is there an elevator?",c:["It's on the fourth floor.","It closes at five o'clock.","The tickets are 1,200 yen.","You can't take pictures there."],a:0,jp:"Where \u3067\u5834\u6240\u3092\u805E\u304B\u308C\u3066\u3044\u308B\u306E\u3067\u5834\u6240\u3067\u7B54\u3048\u308B\u3002\u300C\u30A8\u30EC\u30D9\u30FC\u30BF\u30FC\u306F\u3042\u308A\u307E\u3059\u304B\u300D\u3068\u7D9A\u304F\u306E\u3082\u3001\u4E0A\u306E\u968E\u3060\u3068\u7B54\u3048\u305F\u624B\u304C\u304B\u308A\u3002"},{q:"A: Could you look after my cat while I'm away?\nB: (\u3000) How long will you be gone?\nA: Just three days.",c:["Sure, no problem.","Sorry, I don't have a cat.","I'll buy you a new one.","I'm afraid I can't this time."],a:0,jp:"look after \u301C(\u4E16\u8A71\u3092\u3059\u308B)\u3002\u300C\u3069\u306E\u304F\u3089\u3044\u7559\u5B88\u306B\u3059\u308B\u306E\uFF1F\u300D\u3068\u5177\u4F53\u7684\u306A\u8A71\u306B\u9032\u3093\u3067\u3044\u308B\u306E\u3067\u3001\u307E\u305A\u5F15\u304D\u53D7\u3051\u308B\u8FD4\u4E8B\u3002"},{q:"A: What time do we have to be at school for the field trip?\nB: (\u3000)\nA: That's early. I'll set my alarm for six.",c:["By seven fifteen.","At the school gate.","It takes about two hours by bus.","We're going to a science museum."],a:0,jp:"What time \u306F\u6642\u523B\u3092\u5C0B\u306D\u308B\u7591\u554F\u8A5E\u3002\u300C\u65E9\u3044\u306D\u30016\u6642\u306B\u76EE\u899A\u307E\u3057\u3092\u304B\u3051\u308B\u300D\u3068\u7D9A\u304F\u306E\u3082\u3001\u6642\u523B\u304C\u7B54\u3048\u3060\u3068\u3044\u3046\u624B\u304C\u304B\u308A\u3002"},{q:"A: It's raining and I didn't bring an umbrella.\nB: (\u3000)\nA: Are you sure? Thank you so much.",c:["You can use mine. I have two today.","I forgot mine, too.","The rain will stop soon, I think.","You should have checked the forecast."],a:0,jp:"\u300C\u672C\u5F53\u306B\uFF1F\u3042\u308A\u304C\u3068\u3046\u300D\u3068\u611F\u8B1D\u3057\u3066\u3044\u308B\u306E\u3067\u3001\u5098\u3092\u8CB8\u3059\u7533\u3057\u51FA\u3002\u81EA\u5206\u3082\u5FD8\u308C\u305F\u30FB\u4E88\u5831\u3092\u898B\u308B\u3079\u304D\u3060\u3063\u305F\u3001\u3067\u306F\u611F\u8B1D\u306B\u3064\u306A\u304C\u3089\u306A\u3044\u3002"},{q:"A: (\u3000)\nB: I'm afraid I can't. I have to go to the dentist after school.\nA: OK. I'll ask someone else, then.",c:["Could you take my turn cleaning the classroom tomorrow?","Are you going to the dentist tomorrow?","Did you clean the classroom yesterday?","Shall I help you with your homework?"],a:0,jp:"\u300C\u4ED6\u306E\u4EBA\u306B\u9 :"According to the passage, how do some train companies encourage more people to enjoy traveling by train?",a:"By selling special tickets with discounts for tourists.",aJp:"\u89B3\u5149\u5BA2\u5411\u3051\u306E\u5272\u5F15\u4ED8\u304D\u7279\u5225\u5207\u7B26\u3092\u58F2\u308B\u3053\u3068\u306B\u3088\u3063\u3066\u3002",hint:"discount(\u5272\u5F15)\u306F\u4ED5\u4E8B\u3067\u3082\u983B\u51FA\u306E\u30AB\u30BF\u30AB\u30CA\u8A9E\u3002"},{no:2,type:"scene",q:"Please look at the five people. Tell me, as much as you can, what they are doing.",scene:["\u7537\u6027\u304C\u5207\u7B26\u3092\u8CB7\u3063\u3066\u3044\u308B","\u5973\u6027\u304C\u30D9\u30F3\u30C1\u3067\u5F85\u3063\u3066\u3044\u308B","\u5C11\u5973\u304C\u96FB\u8ECA\u306B\u4E57\u308A\u8FBC\u3093\u3067\u3044\u308B","\u7537\u6027\u304C\u6642\u523B\u8868\u3092\u898B\u3066\u3044\u308B","\u5973\u6027\u304C\u96FB\u8A71\u3067\u8A71\u3057\u3066\u3044\u308B"],a:"A man is buying a ticket. / A woman is waiting on the bench. / A girl is getting on the train. / A man is looking at the timetable. / A woman is talking on the phone.",aJp:"get on(\u4E57\u308A\u8FBC\u3080)\u306F\u4E57\u308A\u7269\u306E\u57FA\u672C\u719F\u8A9E\u3002",hint:"get on / get off(\u964D\u308A\u308B)\u306F\u30BB\u30C3\u30C8\u3067\u53E3\u306B\u99B4\u67D3\u307E\u305B\u308B\u3002"},{no:3,type:"scene",q:"Now, look at the man. Please describe the situation.",scene:["\u7537\u6027\u304C\u96FB\u8ECA\u306B\u4E57\u308A\u305F\u3044\u304C\u3001\u30C9\u30A2\u304C\u9589\u307E\u3063\u3066\u3057\u307E\u3063\u3066\u4E57\u308C\u306A\u3044"],a:"He wants to get on the train, but he can't because the doors have just closed.",aJp:"\u4E57\u308A\u305F\u3044\u304C\u30C9\u30A2\u304C\u9589\u307E\u3063\u305F\u3002",hint:"\u96E3\u3057\u3051\u308C\u3070 because the doors are closed. \u3067\u3082\u5341\u5206\u901A\u3058\u308B\u3002"},{no:4,type:"opinion",q:"Do you think traveling by train is better than traveling by car?",a:"No. I think cars are better because we can go anywhere at any time.", u3053\u3068\u3067\u3001\u8CB7\u3044\u624B\u304C\u5B89\u5FC3\u3067\u304D\u308B\u3088\u3046\u306B\u3059\u308B\u30B5\u30A4\u30C8\u3082\u3042\u308B\u3002",note:"used(\u4E2D\u53E4\u306E)/ quality(\u54C1\u8CEA\u30FB\u65E2\u51FA)/ at low prices(\u5B89\u3044\u4FA1\u683C\u3067)\u3002",qs:[{no:1,type:"passage",q:"According to the passage, how do some websites help buyers feel safe?",a:"By checking the quality of used items before selling them.",aJp:"\u8CA9\u58F2\u524D\u306B\u4E2D\u53E4\u54C1\u306E\u54C1\u8CEA\u3092\u78BA\u8A8D\u3059\u308B\u3053\u3068\u306B\u3088\u3063\u3066\u3002",hint:"quality(\u54C1\u8CEA)\u306F\u5358\u8A9E\u30E2\u30FC\u30C9\u65E2\u51FA\u3002\u4E2D\u53E4\u54C1\u9078\u3073\u306E\u8981\u70B9\u3002"},{no:2,type:"scene",q:"Please look at the five people. Tell me, as much as you can, what they are doing.",scene:["\u5973\u6027\u304C\u53E4\u7740\u3092\u9078\u3093\u3067\u3044\u308B","\u7537\u6027\u304C\u5024\u672D\u3092\u898B\u3066\u3044\u308B","\u5C11\u5E74\u304C\u4E2D\u53E4\u306E\u81EA\u8EE2\u8ECA\u3092\u8A66\u3057\u3066\u3044\u308B","\u5C11\u5973\u304C\u672C\u3092\u68DA\u306B\u623B\u3057\u3066\u3044\u308B","\u7537\u6027\u304C\u5546\u54C1\u3092\u64AE\u5F71\u3057\u3066\u3044\u308B"],a:"A woman is choosing used clothes. / A man is looking at a price tag. / A boy is trying a used bicycle. / A girl is putting a book back on the shelf. / A man is taking a picture of a product.",aJp:"price tag(\u5024\u672D)/ try(\u8A66\u3059)\u3002",hint:"try(\u8A66\u3059)\u306F\u8A66\u7740\u30FB\u8A66\u4E57\u306E\u4E21\u65B9\u306B\u4F7F\u3048\u308B\u3002"},{no:3,type:"scene",q:"Now, look at the man. Please describe the situation.",scene:["\u7537\u6027\u304C\u4E2D\u53E4\u8ECA\u3092\u8CB7\u3044\u305F\u3044\u304C\u3001\u5024\u6BB5\u304C\u9AD8\u3059\u304E\u3066\u8CB7\u3048\u306A\u3044"],a:"He wants to buy a used car, but he can't because it is too expensive.",aJp:"\u8CB7\u3044\u305F\u3044\u304C\u9AD8\u3059\u304E\u308B\u3002",hint:"too expensive(\u9AD8\u3059\u304E\u308B)\u3002too\u306E\u4F7F\u3044\u65B9\u306E\u5B9A\u756A\u3002"},{no:4,type:"opinion",q:"Do you think buying used things is a good idea?",a:"Yes. People can save money, and it is good for the environment.",aJp:"\u306F\u3044\u3002\u7BC0\u7D04\u306B\u306A\u308A\u74B0\u5883\u306B\u3082\u826F\u3044\u304B\u3089\u3067\u3059\u3002",hint:"save money + good for the environment \u306E2\u672C\u7ACB\u3066\u3002\u7406\u75312\u3064\u3067\u6E80\u70B9\u72D9\u3044\u3002"},{no:5,type:"opinion",q:"Have you ever bought something used?",a:"Yes. I often buy used books on the Internet.",aJp:"\u306F\u3044\u3002\u30CD\u30C3\u30C8\u3067\u4E2D\u53E4\u306E\u672C\u3092\u3088\u304F\u8CB7\u3044\u307E\u3059\u3002",hint:"online(\u30CD\u30C3\u30C8\u3067)\u3002\u8CB7\u3063\u305F\u7269\u3092\u5177\u4F53\u7684\u306B\u8A00\u3048\u308B\u3068\u306A\u304A\u826F\u3044\u3002"}]},{id:"i31",topic:"Local Food",passage:"Buying food made in your own area is good for both farmers and customers. The food is fresh, and it does not travel a long way. Some supermarkets put the farmer's name and photo on each package, and in this way, they help customers feel closer to the people who grow their food.",passageJp:"\u5730\u5143\u3067\u4F5C\u3089\u308C\u305F\u98DF\u3079\u7269\u3092\u8CB7\u3046\u3053\u3068\u306F\u8FB2\u5BB6\u306B\u3082\u5BA2\u306B\u3082\u826F\u3044\u3002\u65B0\u9BAE\u3067\u9577\u8DDD\u96E2\u8F38\u9001\u3082\u4E0D\u8981\u3060\u3002\u5404\u30D1\u30C3\u30B1\u30FC\u30B8\u306B\u8FB2\u5BB6\u306E\u540D\u524D\u3068\u5199\u771F\u3092\u8F09\u305B\u308B\u3053\u3068\u3067\u3001\u751F\u7523\u8005\u3092\u8EAB\u8FD1\u306B\u611F\u3058\u3089\u308C\u308B\u3088\u3046\u306B\u3059\u308B\u30B9\u30FC\u30D1\u30FC\u3082\u3042\u308B\u3002",note:"made in \u301C(\u301C\u3067\u4F5C\u3089\u308C\u305F)\u306F\u5F8C\u7F6E\u4FEE\u98FE\u3002grow(\u80B2\u3066\u308B\u30FB\u683D\u57F9\u3059\u308B)\u3002",qs:[{no:1,type:"passage",q:"According to the passage, how do some supermarkets help customers feel closer to the people who grow their food?",a:"By putting the farmer's name and photo on each package.",aJp:"\u5404\u5305\u88C5\u306B\u8FB2\u5BB6\u306E\u540D\u524D\u3068\u5199\u771F\u3092\u8F09\u305B\u308B\u3053\u3068\u306B\u3088\u3063\u3066\u3002",hint:"put A on B(B\u306BA\u3092\u8F09\u305B\u308B)\u3002\u516C\u5712\u306E\u7167\u660E\u306E\u30AB\u30FC\u30C9\u3067\u3082 put \u304C\u51FA\u305F\u3002"},{no:2,type:"scene",q:"Please look at the five people. Tell me, as much as you can, what they are doing.",scene:["\u7537\u6027\u304C\u30C8\u30DE\u30C8\u3092\u53CE\u7A6B\u3057\u3066\u3044\u308B","\u5973\u6027\u304C\u91CE\u83DC\u3092\u888B\u306B\u5165\u308C\u3066\u3044\u308B","\u5C11\u5E74\u304C\u304B\u3054\u3092\u904B\u3093\u3067\u3044\u308B","\u5C11\u5973\u304C\u30A4\u30C1\u30B4\u3092\u6D17\u3063\u3066\u3044\u308B","\u7537\u6027\u304C\u5024\u6BB5\u3092\u66F8\u3044\u3066\u3044\u308B"],a:"A man is picking tomatoes. / A woman is putting vegetables in a bag. / A boy is carrying a basket. / A girl is washing strawberries. / A man is writing prices.",aJp:"pick(\u6458\u3080\u30FB\u53CE\u7A6B\u3059\u308B)\u3002harvest(\u53CE\u7A6B\u30FB\u65E2\u51FA)\u306E\u52D5\u8A5E\u7248\u3002",hint:"pick up(\u62FE\u3044\u4E0A\u3052\u308B\u30FB\u65E2\u51FA\u719F\u8A9E)\u3068pick(\u6458\u3080)\u306E\u9055\u3044\u3082\u610F\u8B58\u3002"},{no:3,type:"scene",q:"Now, look at the woman. Please describe the situation.",scene:["\u5973\u6027\u304C\u30C8\u30DE\u30C8\u3092\u8CB7\u3044\u305F\u3044\u304C\u3001\u58F2\u308A\u5207\u308C\u3066\u3044\u3066\u8CB7\u3048\u306A\u3044"],a:"She wants to buy tomatoes, but she can't because they are sold out.",aJp:"\u8CB7\u3044\u305F\u3044\u304C\u58F2\u308A\u5207\u308C\u3002",hint:"sold out(\u58F2\u308A\u5207\u308C)\u3002\u8CB7\u3044\u7269\u306E\u5834\u9762\u3067\u983B\u51FA\u3002"},{no:4,type:"opinion",q:"Do you think it is important to buy local food?",a:"Yes. It supports local farmers and the food is fresher.",aJp:"\u306F\u3044\u3002\u5730\u5143\u8FB2\u5BB6\u3092\u652F\u3048\u3001\u3088\u308A\u65B0\u9BAE\u3060\u304B\u3089\u3067\u3059\u3002",hint:"support(\u652F\u3048\u308B\u30FB\u65E2\u51FA)\u3002\u5730\u57DF\u306E\u8A71\u984C\u3067\u4F7F\u3044\u3084\u3059\u3044\u3002"},{no:5,type:"opinion",q:"Do you buy vegetables at local shops?",a:"Yes. My family sometimes buys vegetables from a farm near our house.",aJp:"\u306F\u3044\u3002\u3046\u3061\u306F\u3068\u304D\u3069\u304D\u5BB6\u306E\u8FD1\u304F\u306E\u8FB2\u5834\u3067\u91CE\u83DC\u3092\u8CB7\u3044\u307E\u3059\u3002",hint:"near our house(\u5BB6\u306E\u8FD1\u304F\u306E)\u3002\u5834\u6240\u3092\u8DB3\u3059\u3068\u5177\u4F53\u7684\u306B\u306A\u308B\u3002"}]}],Yp=[{t:"Sunny Beach Cleanup Day",g:"\u63B2\u793A",p:"Sunny Town will hold a beach cleanup event on Saturday, May 18, from 9 a.m. to noon. Anyone can join. Please meet at the east gate of Sunny Beach Park at 8:45 a.m. Gloves and garbage bags will be given to everyone, but please bring your own drink. After the cleanup, free ice cream will be served to all volunteers. If it rains, the event will be moved to the next Saturday. For more information, please call the town office. Last year, about 150 people joined and cleaned the whole beach in three hours. Children under 12 must come with an adult."},{t:"An E-mail from Lisa",g:"E\u30E1\u30FC\u30EB",p:"Hi Kenta,\nThank you for inviting me to your school festival next Sunday. I'd love to go! My train will arrive at Midori Station at 10:30 a.m. Could you meet me there? Also, my little brother Tom wants to come with me. He is interested in the robot show at your festival. After the festival, let's have dinner at the new Italian restaurant near the station. I heard their pizza is great. I have never been to a Japanese school festival, so I am really looking forward to it. Tom and I will bring some cookies that our mother made.\nSee you soon,\nLisa"},{t:"Guide Dogs",g:"\u8AAC\u660E\u6587",p:"Guide dogs help people who cannot see well. These dogs are trained for about two years before they start working. During the training, they learn to stop at corners and to keep their owners away from danger. Not all dogs can become guide dogs. Calm and friendly dogs, such as Labradors, are usually chosen. When a guide dog is working, people should not touch or call it. This is because the dog needs to think only about its owner's safety. Before the training starts, puppies live with volunteer families for about one year. After a guide dog retires, it usually stays with a family as a pet."},{t:"Vegetables in Tall Buildings",g:"\u8AAC\u660E\u6587",p:"In some big cities, vegetables are grown inside tall buildings. This is called vertical farming. The vegetables grow under special lights, so weather does not affect them. Farmers can grow vegetables all year and use less water than on normal farms. However, vertical farming needs a lot of electricity, so the vegetables are often more expensive. Some companies are now trying to use solar power to solve this problem. Vertical farms are often built close to shops and restaurants. This means the vegetables can be sold soon after they are picked, and trucks do not have to travel far."},{t:"The First Bicycles",g:"\u8AAC\u660E\u6587",p:"The first bicycle was made in Germany about 200 years ago. It had no pedals, so riders had to push the ground with their feet. Later, pedals were added, and bicycles became faster. However, early bicycles had wooden wheels, and riding them was not comfortable. When rubber tires were invented, bicycles became popular around the world. Today, bicycles are used not only for fun but also as an important way to travel in many cities. The first bicycle had a heavy wooden frame, and it was hard to go up hills. Even so, people were surprised to see a machine that could carry a person without a horse."},{t:"School Lunches Around the World",g:"\u8AAC\u660E\u6587",p:"School lunches are different around the world. In France, students eat a four-course meal and take more than one hour for lunch. In India, many schools serve free curry and rice to students. In Japan, students often carry the food to their classrooms and eat together. They also clean up after eating. Some people say that school lunches teach children not only about food but also about culture and working together. In the United States, students can often choose their food in a school cafeteria. Lunchtime there is usually short, so students eat quickly and go back to class."},{t:"City Library Photo Contest",g:"\u63B2\u793A",p:"Green City Library will hold a photo contest in October. The theme is \"Autumn in Our City.\" Anyone who lives in Green City can join. Please send one photo by e-mail to the library by September 30. The winners will be chosen by three local photographers and will be announced on October 15 on the library's website. The best ten photos will be shown at the library entrance for one month. The winner of first prize will receive a new camera. For more details, please visit the library's website."},{t:"An E-mail from Jack",g:"E\u30E1\u30FC\u30EB",p:"Hi Kenta,\nThank you for showing me around Kyoto last weekend. I really enjoyed it. The old temple we visited was beautiful, and the green tea ice cream was delicious. I took a lot of pictures, so I will send some of them with my next e-mail.\nBy the way, my town will have a winter festival on December 20. There will be a big fireworks show at night, and we can eat many kinds of local food. My father says he can drive us there. Would you like to come with us? If you can, please tell me by the end of November.\nYour friend,\nJack"},{t:"The History of Ice Cream",g:"\u8AAC\u660E\u6587",p:"Ice cream is loved around the world, but no one knows exactly where it was born. About 2,000 years ago, people in some countries enjoyed snow mixed with honey or fruit juice.Ice cream like the kind we eat today is said to have been made in Italy about 400 years ago. At that time, ice was very expensive, so only rich people could enjoy it. In the 19th century, machines for making ice were invented, and ice cream became cheaper. Today, people can buy many flavors at supermarkets, and new ones are created every year."},{t:"Working Dogs at Airports",g:"\u8AAC\u660E\u6587",p:"At many airports, dogs work with customs officers.These dogs are called sniffer dogs, and they have a very good nose. They can find dangerous things or food that people cannot bring into the country. Becoming an airport dog is not easy.Dogs must go through about six months of training, and only some of them pass the test. Many of these dogs are beagles. Beagles are small and friendly, so people at airports do not feel afraid of them. After they get old, most airport dogs are welcomed by new families and live with them."},{t:"A New Way to Sell Vegetables",g:"\u8AAC\u660E\u6587",p:"In Japan, some farmers sell their vegetables in unusual shops. The shops have no staff. Customers choose vegetables, put money into a box, and take the vegetables home. These small shops are often seen near farms in the countryside. They are helpful for farmers because they do not have to pay staff or spend time selling. Also, the vegetables are fresh and cheaper than the ones at supermarkets. Some people worry that customers may not pay, but most customers follow the rule. Farmers say these shops are supported by trust between people."},{t:"Volunteer Guides Wanted",g:"\u63B2\u793A",p:"Hilltown Station is looking for volunteer guides to help foreign tourists. Guides will answer questions about buses, trains, and places to visit in Hilltown. You do not have to speak English perfectly. Volunteers must be 16 years old or over and must work at least two days a month. A free training class will be held on April 6 and April 13. You need to join both classes. Volunteers will receive a free lunch on the days they work. If you are interested, please send your name and phone number to the station office by March 25."},{t:"An E-mail from Ms. Carter",g:"E\u30E1\u30FC\u30EB",p:"Dear Yuki,\nThank you for your report about the science club. I read it carefully, and I found it very interesting. However, I think you should add one more thing. You wrote about the experiments the club did last year, but you did not write about the results. Readers will want to know what the club learned from them.\nCould you send me the new report by next Wednesday? I will check it again and print it in the school newspaper in June. Also, if you have any photos of the experiments, please send them, too.\nBest regards,\nMs. Carter"},{t:"Sleeping Longer on Weekends",g:"\u8AAC\u660E\u6587",p:"Many students sleep much longer on weekends than on weekdays. They think this is a good way to get back the sleep they lost. However, some scientists say it does not work well. If you wake up three hours later than usual on Sunday, your body clock also moves three hours later. Then it becomes hard to wake up early on Monday morning. The scientists say a better way is to go to bed earlier during the week. If you still feel tired on weekends,a short nap of about twenty minutes in the afternoon is enough."},{t:"The Language of Bees",g:"\u8AAC\u660E\u6587",p:"Bees cannot speak, but they can tell each other where flowers are. When a bee finds good flowers, it flies back to its home and dances in front of the other bees.The angle of the dance shows the direction, and the length of the dance shows the distance. If the flowers are close, the bee dances in a circle. This was discovered by a scientist about one hundred years ago, and he later received a famous prize for his work. Today, farmers use this knowledge to help bees find their fields more easily."}],Vr=[{id:"r0",pi:0,q:"What time should volunteers meet at the park?",c:["At 8:45 a.m.","At 9:00 a.m.","At noon.","At 8:15 a.m."],a:0,jp:"\u672C\u65873\u6587\u76EE\u306B Please meet ... at 8:45 a.m. \u3068\u3042\u308B\u3002\u958B\u59CB\u6642\u523B(9\u6642)\u3068\u96C6\u5408\u6642\u523B\u306E\u3072\u3063\u304B\u3051\u306B\u6CE8\u610F\u3002"},{id:"r1",pi:0,q:"What do volunteers need to bring?",c:["Their own drink.","Gloves.","Garbage bags.","Ice cream."],a:0,jp:"\u624B\u888B\u3068\u3054\u307F\u888B\u306F\u914D\u3089\u308C\u308B(will be given)\u3002bring your own drink=\u98F2\u307F\u7269\u306F\u6301\u53C2\u3002"},{id:"r2",pi:0,q:"What will happen if it rains on May 18?",c:["The event will be held the next Saturday.","The event will be canceled.","The event will be held inside.","The event will start at noon."],a:0,jp:"If it rains, ... moved to the next Saturday. \u4E2D\u6B62(cancel)\u3067\u306F\u306A\u304F\u5EF6\u671F\u3002"},{id:"r3",pi:1,q:"What does Lisa ask Kenta to do?",c:["Meet her at the station.","Buy train tickets for her.","Make a robot with Tom.","Cook pizza for dinner."],a:0,jp:"Could you meet me there?=\u99C5\u3067\u4F1A\u3063\u3066\u307B\u3057\u3044\u3002Could you \u301C?\u306F\u4F9D\u983C\u306E\u5B9A\u756A\u8868\u73FE\u3002"},{id:"r4",pi:1,q:"Why does Tom want to come to the festival?",c:["He is interested in the robot show.","He likes Italian food.","He wants to take a train.","He goes to Kenta's school."],a:0,jp:"He is interested in the robot show. \u5F1F\u306E\u76EE\u5F53\u3066\u306F\u30ED\u30DC\u30C3\u30C8\u30B7\u30E7\u30FC\u3002"},{id:"r5",pi:1,q:"What does Lisa want to do after the festival?",c:["Have dinner at a restaurant.","Watch the robot show again.","Go back home right away.","Visit Kenta's house."],a:0,jp:"After the festival, let's have dinner at the new Italian restaurant \u3068\u3042\u308B\u3002"},{id:"r6",pi:2,q:"How long are guide dogs trained before they start working?",c:["For about two years.","For about two months.","For about ten years.","For about two weeks."],a:0,jp:"trained for about two years\u3002\u671F\u9593\u306E\u6570\u5B57\u306F\u5FC5\u305A\u672C\u6587\u3067\u78BA\u8A8D\u3059\u308B\u7656\u3092\u3002"},{id:"r7",pi:2,q:"What kind of dogs are usually chosen as guide dogs?",c:["Calm and friendly dogs.","Big and strong dogs.","Fast and young dogs.","Small and quiet dogs."],a:0,jp:"Calm and friendly dogs ... are usually chosen\u3002\u6027\u683C\u304C\u9078\u8003\u57FA\u6E96\u3002"},{id:"r8",pi:2,q:"Why shouldn't people touch a working guide dog?",c:["Because it must think about its owner's safety.","Because it may get angry.","Because it is always sleeping.","Because its owner will be surprised."],a:0,jp:"This is because \u301C \u304C\u7406\u7531\u306E\u30B5\u30A4\u30F3\u3002\u98FC\u3044\u4E3B\u306E\u5B89\u5168\u306B\u96C6\u4E2D\u3059\u308B\u5FC5\u8981\u304C\u3042\u308B\u304B\u3089\u3002"},{id:"r9",pi:3,q:"Why can vegetables be grown all year in vertical farms?",c:["Because weather does not affect them.","Because they grow near windows.","Because farmers water them every day.","Because the buildings are warm."],a:0,jp:"grow under special lights, so weather does not affect them\u3002so \u306E\u524D\u5F8C\u304C\u56E0\u679C\u95A2\u4FC2\u3002"},{id:"r10",pi:3,q:"What is a problem with vertical farming?",c:["It needs a lot of electricity.","It uses too much water.","Vegetables grow too slowly.","Buildings are too small."],a:0,jp:"However \u4EE5\u4E0B\u306B\u554F\u984C\u70B9\u3002needs a lot of electricity=\u96FB\u6C17\u3092\u5927\u91CF\u306B\u4F7F\u3046\u3002"},{id:"r11",pi:3,q:"How are some companies trying to solve the problem?",c:["By using solar power.","By building taller farms.","By selling cheaper vegetables.","By growing vegetables outside."],a:0,jp:"trying to use solar power to solve this problem\u3002\u592A\u967D\u5149\u767A\u96FB\u3067\u89E3\u6C7A\u3092\u56F3\u308B\u3002"},{id:"r12",pi:4,q:"What was different about the first bicycle?",c:["It had no pedals.","It had rubber tires.","It was made of plastic.","It had three wheels."],a:0,jp:"It had no pedals, so riders had to push the ground\u3002\u6700\u521D\u306E\u81EA\u8EE2\u8ECA\u306F\u30DA\u30C0\u30EB\u7121\u3057\u3002"},{id:"r13",pi:4,q:"Why was riding early bicycles not comfortable?",c:["Because they had wooden wheels.","Because they were too fast.","Because they were too small.","Because riders had to stand."],a:0,jp:"early bicycles had wooden wheels, and riding them was not comfortable\u3002\u6728\u306E\u8ECA\u8F2A\u304C\u539F\u56E0\u3002"},{id:"r14",pi:4,q:"What made bicycles popular around the world?",c:["Rubber tires.","Wooden wheels.","Faster pedals.","New roads."],a:0,jp:"When rubber tires were invented, bicycles became popular\u3002\u30B4\u30E0\u30BF\u30A4\u30E4\u306E\u767A\u660E\u304C\u8EE2\u6A5F\u3002"},{id:"r15",pi:5,q:"How long do students in France take for lunch?",c:["More than one hour.","About 15 minutes.","Half an hour.","Two full hours."],a:0,jp:"take more than one hour for lunch\u3002\u56FD\u540D\u3068\u6570\u5B57\u306E\u5BFE\u5FDC\u3092\u6B63\u78BA\u306B\u3002"},{id:"r16",pi:5,q:"What do many schools in India serve to students?",c:["Free curry and rice.","A four-course meal.","Bread and milk.","Cold sandwiches."],a:0,jp:"In India, many schools serve free curry and rice\u3002\u56FD\u304C\u5909\u308F\u308B\u3068\u5185\u5BB9\u3082\u5909\u308F\u308B\u3002"},{id:"r17",pi:5,q:"What do some people say about school lunches?",c:["They teach children about culture and working together.","They should be shorter.","They are too expensive.","They should be cooked by students."],a:0,jp:"\u6700\u7D42\u6587 Some people say that \u301C \u304C\u7B46\u8005\u306E\u307E\u3068\u3081\u3002\u9577\u6587\u306E\u6700\u5F8C\u306E1\u6587\u306F\u8A2D\u554F\u306B\u306A\u308A\u3084\u3059\u3044\u3002"},{id:"r18",pi:6,q:"Who can join the photo contest?",c:["People living in Green City.","Anyone who has a new camera.","Only local photographers.","Students of Green City Library."],a:0,jp:"Anyone who lives in Green City can join. \u3068\u3042\u308B\u30023\u4EBA\u306E\u5199\u771F\u5BB6\u306F\u300C\u5BE9\u67FB\u3059\u308B\u5074\u300D\u306A\u306E\u3067\u53C2\u52A0\u8005\u3067\u306F\u306A\u3044\u3002"},{id:"r19",pi:6,q:"How will people know the winners?",c:["By checking the library's website on October 15.","By visiting the library on September 30.","By sending an e-mail to the library.","By meeting the photographers at the entrance."],a:0,jp:"will be announced on October 15 on the library's website \u304C\u6839\u62E0\u30029\u670830\u65E5\u306F\u5FDC\u52DF\u306E\u7DE0\u3081\u5207\u308A\u65E5\u3002"},{id:"r20",pi:6,q:"What will the first prize winner get?",c:["A new camera.","Ten photos.","A one-month library ticket.","A trip to the city."],a:0,jp:"The winner of first prize will receive a new camera. \u3068\u3042\u308B\u3002receive(\u53D7\u3051\u53D6\u308B)\u3002\u4E0A\u4F4D10\u679A\u306F\u300C\u5C55\u793A\u3055\u308C\u308B\u300D\u3060\u3051\u3002"},{id:"r21",pi:7,q:"Why is Jack thanking Kenta?",c:["Kenta showed him around Kyoto.","Kenta sent him many pictures.","Kenta bought him a ticket to Kyoto.","Kenta drove him to the old temple."],a:0,jp:"Thank you for showing me around Kyoto last weekend. \u304C\u6839\u62E0\u3002\u5199\u771F\u306F\u9006\u306B\u300C\u30B8\u30E3\u30C3\u30AF\u304C\u9001\u308B\u300D\u5074\u3067\u3001\u8ECA\u3092\u51FA\u3059\u306E\u306F\u30B8\u30E3\u30C3\u30AF\u306E\u7236\u3002"},{id:"r22",pi:7,q:"What will Jack do in his next e-mail?",c:["Send some pictures of the trip.","Tell Kenta about the old temple.","Invite Kenta to his school.","Ask Kenta to buy ice cream."],a:0,jp:"I will send some of them with my next e-mail \u306E them \u306F\u300C\u64AE\u3063\u305F\u5199\u771F\u300D\u3092\u6307\u3059\u3002\u6307\u793A\u8A9E\u3092\u524D\u306E\u6587\u304B\u3089\u8FFD\u3046\u3002"},{id:"r23",pi:7,q:"What does Jack want Kenta to do by the end of November?",c:["Tell him if he can come to the winter festival.","Buy tickets for the fireworks show.","Ask his father to drive them.","Send local food to Jack's town."],a:0,jp:"please tell me by the end of November \u306E\u5185\u5BB9\u306F\u3001\u76F4\u524D\u306E Would you like to come with us? \u3078\u306E\u8FD4\u4E8B\u3002\u8ECA\u3092\u51FA\u3059\u306E\u306F\u30B8\u30E3\u30C3\u30AF\u306E\u7236\u3002"},{id:"r24",pi:8,q:"What did people eat about 2,000 years ago?",c:["Snow mixed with honey or fruit juice.","Ice cream made in Italy.","Many flavors of ice cream.","Cheap ice made by machines."],a:0,jp:"About 2,000 years ago \u306E\u6587\u306B snow mixed with honey or fruit juice \u3068\u3042\u308B\u3002\u30A4\u30BF\u30EA\u30A2\u306E\u30A2\u30A4\u30B9\u306F\u7D04400\u5E74\u524D\u3002"},{id:"r25",pi:8,q:"Why could only rich people enjoy ice cream about 400 years ago?",c:["Because ice was very expensive.","Because there were no supermarkets.","Because machines were expensive.","Because honey was hard to find."],a:0,jp:"ice was very expensive, so ... \u306E so \u304C\u7406\u7531\u3068\u7D50\u679C\u3092\u3064\u306A\u3050\u3002so \u306E\u524D\u304C\u7406\u7531\u3002"},{id:"r26",pi:8,q:"What happened in the 19th century?",c:["Ice cream became cheaper.","Ice cream was born in Italy.","People stopped eating ice cream.","Supermarkets began to sell snow."],a:0,jp:"In the 19th century, machines ... were invented, and ice cream became cheaper. \u3068\u3042\u308B\u3002"},{id:"r27",pi:9,q:"What can airport dogs do?",c:["Find things that people cannot bring into the country.","Fly with police officers.","Check people's tickets at the gate.","Carry heavy bags for visitors."],a:0,jp:"They can find dangerous things or food that people cannot bring into the country. \u304C\u6839\u62E0\u3002"},{id:"r28",pi:9,q:"Why are many airport dogs beagles?",c:["Because they are small and friendly.","Because they are the fastest dogs.","Because their training is short.","Because they like traveling."],a:0,jp:"Beagles are small and friendly, so ... \u306E so \u306E\u524D\u304C\u7406\u7531\u3002\u4EBA\u304C\u6016\u304C\u3089\u306A\u3044\u3001\u3068\u3044\u3046\u7D50\u679C\u306B\u3064\u306A\u304C\u308B\u3002"},{id:"r29",pi:9,q:"What happens to most airport dogs after they get old?",c:["They live with new families.","They keep working at airports.","They take the training test again.","They move to another country."],a:0,jp:"most airport dogs are welcomed by new families and live with them \u3068\u3042\u308B\u3002welcome(\u8FCE\u30 eers get?",c:["A free lunch on the days they work.","Money for two days a month.","A free train ticket.","A guidebook of Hilltown."],a:0,jp:"Volunteers will receive a free lunch on the days they work. \u304C\u6839\u62E0\u3002\u30DC\u30E9\u30F3\u30C6\u30A3\u30A2\u306A\u306E\u3067\u7D66\u6599\u306F\u51FA\u306A\u3044\u3002"},{id:"r36",pi:12,q:"What does Ms. Carter think about Yuki's report?",c:["It is interesting, but something is missing.","It is too long and should be shorter.","It has many mistakes in English.","It is not about the science club."],a:0,jp:"very interesting \u306E\u5F8C\u306B However, ... you should add one more thing \u3068\u7D9A\u304F\u3002However \u306E\u5F8C\u308D\u306B\u672C\u984C\u304C\u6765\u308B\u3002"},{id:"r37",pi:12,q:"What did Yuki forget to write about?",c:["What the club learned from the experiments.","The name of the science club.","The experiments the club did last year.","The date of the school newspaper."],a:0,jp:"you did not write about the results \uFF0B what the club learned from them \u304C\u6839\u62E0\u3002\u5B9F\u9A13\u305D\u306E\u3082\u306E\u306F\u66F8\u3051\u3066\u3044\u308B\u3002"},{id:"r38",pi:12,q:"What does Ms. Carter ask Yuki to do by next Wednesday?",c:["Send the new report.","Print the school newspaper.","Take photos of the experiments.","Check the report again."],a:0,jp:"Could you send me the new report by next Wednesday? \u304C\u4F9D\u983C\u306E\u4E2D\u8EAB\u3002\u78BA\u8A8D\u3057\u3066\u5370\u5237\u3059\u308B\u306E\u306F\u30AB\u30FC\u30BF\u30FC\u5148\u751F\u306E\u4ED5\u4E8B\u3002"},{id:"r39",pi:13,q:"Why do many students sleep longer on weekends?",c:["They want to get back the sleep they lost.","They have to study late on weekends.","Their body clock moves earlier.","Their teachers tell them to do so."],a:0,jp:"They think this is a good way to get back the sleep they lost. \u304C\u7406\u7531\u3002this \u306F\u9031\u672B\u306B\u9577\u304F\u5BDD\u308B\u3053\u3068\u3092\u6307\u3059\u3002"},{id:"r40",pi:13,q:"What happe
